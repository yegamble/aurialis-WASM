name: Cloudflare Preview Cleanup

# Deletes a pull request's Worker Preview once it is merged or closed. Kept out
# of ci.yml so a `closed` event never starts the full CI pipeline.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete-preview:
    name: Delete Cloudflare Preview
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install Wrangler
        run: pnpm install --frozen-lockfile
      - name: Delete the Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SEND_METRICS: "false"
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        # A PR whose Preview never deployed has nothing to delete; that is not a failure.
        run: |
          if ! pnpm exec wrangler preview delete -c deploy/cloudflare/wrangler.jsonc --name "$PREVIEW_NAME" --skip-confirmation; then
            echo "::warning::No Preview named $PREVIEW_NAME was deleted."
          fi
