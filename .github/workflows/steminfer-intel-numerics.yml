name: Intel Batch Numerical Diagnostics

on:
  push:
    branches:
      - codex/diagnose-intel-batching
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steminfer-intel-numerics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.event_name != 'push' || github.event.deleted != true
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: stem-intel-batch-numerics
      - name: Compare synthetic matrix shapes and transformer batches
        env:
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          go test -run '^Test(IntelBatchNumericsDiagnostics|IntelBatchRoundoffBudget|BatchedTransformerMatchesSingleSequences|FrequencyAxisBatchesAndLanesMatchSerial)$' -count=1 -v -timeout=2m ./internal/audio/steminfer 2>&1 \
            | tee "$RUNNER_TEMP/intel-batch-numerics.log"
      - name: Upload synthetic numerical diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intel-batch-numerics-${{ github.run_id }}
          path: ${{ runner.temp }}/intel-batch-numerics.log
          if-no-files-found: error
          retention-days: 30
