## How We Beat a Traditional Waves Plugin-Chain Workflow

You know every strength and every painful limitation of a traditional Waves plugin chain (`Q10` / `Req` → `SSL G-Master` / `API 2500` → `PuigTec` → `Kramer Tape` → `S1 Imager` → `LinMB` → `L2 Ultramaximizer` → `WLM Meter`). You demand that Aurialis-WASM not merely copy individual plugins, but **beat the Waves workflow**:

1. **Loudness-Matched A/B Listening (Defeating the #1 Waves Trap)**:
   - Classic Waves plugins (`L2`, `CLA-76`, `PuigTec`, `MaxxBass`) boost output volume as you pull down the threshold or turn up drive — fooling amateurs via Fletcher-Munson equal-loudness curves into thinking louder distortion sounds "better."
   - You insist that Aurialis A/B comparison supports **loudness-compensated / honest A/B** alongside true output metering (`LUFS`, `dBTP`, `LRA`, `DR`, `Correlation`), so an engineer hears the *actual* tonal and dynamic improvement without volume deception.
2. **Section-Aware Dynamic Mastering (`MasteringScript` v1) Over Static Bus Chains**:
   - In a traditional DAW + Waves workflow, giving the Chorus `+0.8 dB` push, `+10%` stereo width, and a `+1.0 dB` `12 kHz` air lift while keeping the Verse intimate requires automating 4 separate floating plugin windows.
   - Aurialis beats this with **Deep Mode (`MasteringScript` v1)**: automatic structural section detection (`Intro`, `Verse`, `Chorus`, `Bridge`, `Drop`, `Breakdown`, `Outro`) paired with inspectable, audible, per-section automation moves across `Volume`, `EQ`, `Comp/Sat`, `Width`, and `AI Repair` — with every move explaining *why* in plain mastering engineering language and editable in 2 clicks.
3. **Stem-Aware Mastering (`2–6` Smart Split) & AI-Artifact Repair in One Unified Surface**:
   - When a client sends a stereo 2-track with a vocal buried by `-2 dB` or an AI-generated/heavily compressed stem with `15 kHz` spectral collapse and phase narrowness, a traditional 2-bus EQ/compressor compromises the whole mix.
   - Aurialis lets the engineer split into `2–6` stems (`Vocals`, `Drums`, `Bass`, `Guitar`, `Piano`, `Other`), rebalance/pan in seconds, send directly back to mastering, and apply targeted `AI Repair` without leaving the workstation.
4. **Album-Wide Cohesion & Multi-Platform Release Readiness**:
   - Mastering an album in individual DAW sessions often leaves Track 3 `2.5 LU` hotter and brighter than Track 4. Aurialis's Album Consistency chart (`Loudness`, `Tone`, `Dynamics`) flags outliers visually and numerically, and Release Check validates Spotify (`-14 LUFS`, `-1.0 dBTP`), Apple Music (`-16 LUFS`, `-1.0 dBTP`), YouTube, SoundCloud, CD (`16-bit/44.1kHz` + dither), and Podcast targets in one pass.

