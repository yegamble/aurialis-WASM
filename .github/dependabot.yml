# Version updates: weekly. Minor and patch bumps arrive as one grouped PR per
# ecosystem; major bumps stay separate so each breaking change is reviewed alone.
# Security updates are not configured here: Dependabot alerts and security
# updates are enabled in repository settings and open their own PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # Dependabot's npm ecosystem reads and updates pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Keeps the SHA pins and their "# vX.Y.Z" comments in step, including the
  # composite actions under .github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
