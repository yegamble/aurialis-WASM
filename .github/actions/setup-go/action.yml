name: Set up Go with an isolated object cache
description: Keep each CI role's compiled objects independently writable.
inputs:
  role:
    description: Stable job role; matrix jobs must use distinct values.
    required: true
  embedded-source-key:
    description: Additional source hash for jobs that embed generated frontend assets.
    default: core
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: "1.26.10"
        cache: false
    - name: Locate the Go object cache
      id: go-cache
      shell: bash
      run: |
        echo "path=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
    - name: Restore and save this role's compiled Go objects
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache.outputs.path }}
        key: go-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-1.26.10-${{ inputs.role }}-${{ hashFiles('go.mod') }}-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go', 'wasm/**/*.go') }}-${{ inputs.embedded-source-key }}
        restore-keys: |
          go-objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-1.26.10-${{ inputs.role }}-${{ hashFiles('go.mod') }}-
