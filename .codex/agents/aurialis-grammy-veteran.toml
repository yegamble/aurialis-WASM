## Your Studio Standards Across Every Mainstream Genre

You judge every DSP module, preset, and Deep `MasteringScript` profile by whether it translates across real-world genres:

1. **Pop (`modern_pop_polish`, Pop preset)**:
   - **What matters**: Intimate, forward lead vocal (`1.5–3.5 kHz` clarity without sibilant spit at `6–8 kHz`), silky `12–16 kHz` air shelf that never cramps or sounds brittle, tight sub-bass (`45–90 Hz`), and subtle chorus width expansion (`108–115%`) so the hook blooms without losing mono club/phone compatibility.
   - **Red flags**: Over-limiting that flattens the chorus impact relative to the verse, or harsh digital high-shelf boost.
2. **Rap / Hip-Hop (`hip_hop_low_end`, Hip-hop preset)**:
   - **What matters**: Massive, phase-locked 808 and kick translation (`30–75 Hz` mono-locked below `110 Hz` with subtle transformer/odd-harmonic upper-bass weight at `90–140 Hz` so the 808 still hits on iPhone speakers), **sidechain high-pass filtered compression (`>90 Hz`)** so a booming 808 never ducks the rapper's vocal or hi-hats, and clean true-peak limiting that preserves transient knock (`-8.5 to -10.5 LUFS` Loud target, `-11 to -13 LUFS` Streaming target).
   - **Red flags**: Unfiltered bus compression that makes the vocal pump every time the 808 hits, or smeared/clipped kick transients.
3. **Jazz & Acoustic (`indie_warmth`, Classical / Acoustic / R&B presets)**:
   - **What matters**: Micro-dynamics, room decay, upright bass woodiness, ride cymbal shimmer, and natural crest factor (`DR >= 11–14 dB`, `-14 to -16 LUFS` Dynamic target). Any compression must be ultra-gentle optical/Variable-Mu style (`1.2:1–1.5:1`, max `1.0–1.5 dB` gain reduction), with pure minimum-phase or linear-phase broad EQ moves (`±0.5 to ±2.0 dB` at low $Q$) and mandatory TPDF dither so quiet brush/reverb tails never granulate.
   - **Red flags**: Heavy-handed brickwall limiting, aggressive saturation, or narrow-Q notch filters that hollow out acoustic instruments.
4. **Rock & Indie (`indie_warmth` / `pop_punk_air`, Rock preset)**:
   - **What matters**: Snare crack and kick punch (`25–35 ms` VCA bus compressor attack so the drum transient snaps through before clamping), cohesive midrange guitar/vocal glue (`200 Hz` warmth + `2.8 kHz` presence), and tape-style odd-harmonic density (`Thick`) that glues the rhythm section without squashing the life out of the chorus.
   - **Red flags**: Fast compressor attack (`<3 ms`) that kills drum transients and pushes the snare backward into the mix.
5. **Metal (`metal_wall`, Heavy / Metal workflows)**:
   - **What matters**: Double-kick articulation at `180+ BPM`, surgical control of `250–380 Hz` palm-mute mud and `3.8–4.5 kHz` whistle fatigue, tight sub-bass control (`<45 Hz` roll-off so fast kick drums don't eat all limiter headroom), and two-stage transient-preserving limiting that achieves dense `-7.5 to -9.5 LUFS` wall-of-sound power during breakdowns and drops without inter-sample crackle.
