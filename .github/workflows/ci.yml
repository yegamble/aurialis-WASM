name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  AURIALIS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repo-and-agent-hygiene:
    name: War Room, Stack & Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enforce pnpm-only lockfile policy
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "::error::Forbidden lockfile detected (package-lock.json or yarn.lock). Use pnpm (pnpm-lock.yaml) only."
            exit 1
          fi

      - name: Enforce zero external icon libraries in src/
        run: |
          if [ -d src ]; then
            if grep -RInE "from ['\"](lucide-react|@heroicons/react|react-icons|feather-icons)" src/; then
              echo "::error::External icon libraries are forbidden in src/. Use custom inline SVGs (src/components/shared/Icon.tsx)."
              exit 1
            fi
          fi

      - name: Verify multi-model War Room agent synchronization
        run: |
          python3 -m py_compile scripts/sync-agents.py .claude/hooks/scrutinise.py
          python3 scripts/sync-agents.py --check
          python3 scripts/test-ci-artifacts.py
          python3 scripts/test-ci-browser-artifacts.py
          python3 scripts/test-e2e-build.py
          python3 .github/scripts/test-cloudflare-policy-headers.py

      - name: Smoke-test Stop hook (Claude Code & Gemini Argon payloads)
        run: |
          rm -rf .claude/hooks/.state
          OUT_CLAUDE_1=$(echo '{"hook_event_name": "Stop", "session_id": "ci-1"}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_CLAUDE_1" | grep -q '"decision": "block"'
          OUT_CLAUDE_2=$(echo '{"hook_event_name": "Stop", "session_id": "ci-1"}' | python3 .claude/hooks/scrutinise.py)
          test -z "$OUT_CLAUDE_2"
          OUT_AGY_1=$(echo '{"terminationReason": "NO_TOOL_CALL", "conversationId": "ci-2"}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_AGY_1" | grep -q '"decision": "continue"'
          OUT_AGY_2=$(echo '{"terminationReason": "NO_TOOL_CALL", "conversationId": "ci-2"}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_AGY_2" | grep -q '"decision": "allow"'
          rm -rf .claude/hooks/.state

      - name: Require SHA-pinned actions and explicit tool versions
        run: python3 .github/scripts/check-workflow-pins.py

      - name: Validate GitHub Actions workflows with actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  go-static-quality:
    name: Go Static & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: static-security
      - name: Check gofmt formatting
        run: |
          UNFORMATTED=$("$(go env GOROOT)/bin/gofmt" -l cmd internal wasm)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Go formatting differs: $UNFORMATTED"
            exit 1
          fi
      - name: Verify Go modules and run go vet
        run: |
          go mod verify
          go vet ./...
      - name: Run golangci-lint v2
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.15.0
          args: --timeout=5m
      - name: Run identypo & govulncheck
        run: |
          # identypo has no tagged releases; this is its newest commit.
          go run github.com/alexkohler/identypo/cmd/identypo@v0.0.0-20180915162145-dcb8a7984045 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  go-race-meters:
    name: Go Race & Independent Meters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: race-meters
      - name: Run Go unit & concurrency race tests
        run: go test -race -count=1 -timeout 10m ./...
      - name: Calibrate export budgets against measured render cost
        timeout-minutes: 5
        run: go test -run '^TestExportBudgetCalibration$' -count=1 -v ./internal/server
      - name: Verify full-length Deep profile predictions without the race detector
        timeout-minutes: 5
        run: go test -run '^TestDeepProfilesPredictExportLevelsAndExplainLargeChanges$' -count=1 -v ./internal/mastering
      - name: Verify full-length live/export parity without the race detector
        timeout-minutes: 5
        run: go test -run '^TestLive(Playback|DeepScript)RendersTheExport$' -count=1 -v ./wasm/dsp
      - name: Verify the true-peak ceiling and loud-end parity on every rate without the race detector
        timeout-minutes: 5
        run: go test -run 'HoldTheCeilingAgainstTheLongSincReference$|^TestLivePlaybackOfALoudAbruptEndRendersTheExport$' -count=1 ./wasm/dsp
      - name: Verify the true-peak and live meters on every case without the race detector
        timeout-minutes: 5
        run: go test -run '^Test(ExportMeter|TruePeakMeterReads|LiveMeter)' -count=1 ./internal/audio/dsp
      - name: Verify complete oversampling spectral and saturation matrices without the race detector
        timeout-minutes: 5
        run: go test -run '^Test(Oversampled|Oversampling|CenteredADAA|HighRateReference|Polyphase)' -count=1 ./internal/audio/dsp
      - name: Install FFmpeg for independent meter verification
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            APT_OPTIONS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${APT_OPTIONS[@]}" update
            sudo apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Compare meters with independent FFmpeg reference
        timeout-minutes: 3
        run: python3 wasm/dsp/verify_meters.py

  parser-fuzz-smoke:
    name: Bounded WAV, AIFF & Compressed Parser Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: parser-fuzz
      - name: Fuzz WAV parser with one bounded worker
        timeout-minutes: 2
        run: go test ./internal/audio -run '^$' -fuzz '^FuzzWAVDecode$' -fuzztime=10s -parallel=1
      - name: Fuzz AIFF parser with one bounded worker
        timeout-minutes: 2
        run: go test ./internal/audio -run '^$' -fuzz '^FuzzAIFFDecode$' -fuzztime=10s -parallel=1
      - name: Fuzz FLAC and MP3 CDR parsers with one bounded worker
        timeout-minutes: 2
        run: go test ./internal/audio -run '^$' -fuzz '^FuzzCompressedDecode$' -fuzztime=10s -parallel=1

  frontend-quality:
    outputs:
      artifact-name: ${{ steps.build-identity.outputs.name }}
      build-attempt: ${{ steps.build-identity.outputs.attempt }}
    name: Next.js 16, TypeScript & Bundle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Covers dev tools too: wrangler deploys with the Cloudflare token, and
      # vitest and newman run in CI. Accepted advisories are listed under
      # pnpm.auditConfig.ignoreGhsas in package.json (rationale: docs/development.md).
      - name: Audit all dependencies for high and critical advisories
        run: pnpm audit --audit-level high
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm run lint
      - name: Dead-code & spellcheck gates
        run: |
          pnpm exec knip
          pnpm exec cspell lint "**/*.{ts,tsx,go,md}"
      - name: Run Vitest unit & component suite
        run: pnpm test
      - name: Verify test-only browser proxy and owned process cleanup
        run: node --test scripts/test-serve-browser-qa.mjs scripts/test-serve-browser-e2e.mjs
      - uses: ./.github/actions/setup-go
        with:
          role: native-build
          embedded-source-key: ${{ hashFiles('src/**', 'public/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
      - name: Restore Next build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node26-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}-
      - name: Identify immutable producer artifact
        id: build-identity
        run: |
          echo "name=aurialis-native-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build native-target UI, dual WASM and production executable once
        run: |
          pnpm run build:binary
          pnpm run test:binary
          bash scripts/build-e2e.sh artifacts/ci-runtime/aurialis-e2e
          python3 scripts/ci-artifacts.py pack artifacts/ci-package
      - name: Publish same-run native build for quality, API and browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build-identity.outputs.name }}
          path: artifacts/ci-package/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  browser-build:
    name: Browser-local Static Build
    env:
      NEXT_PUBLIC_AURIALIS_EXECUTION: browser
    outputs:
      artifact-name: ${{ steps.build-identity.outputs.name }}
      build-attempt: ${{ steps.build-identity.outputs.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-go
        with:
          role: browser-build
          embedded-source-key: ${{ hashFiles('src/**', 'public/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
      - name: Restore only browser-target Next build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-browser-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node26-next-browser-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}-
      - name: Identify immutable browser-target artifact
        id: build-identity
        run: |
          echo "name=aurialis-browser-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build browser-target UI and dual WASM once
        run: |
          pnpm run build:browser
          test "$(cat internal/webui/embedded/build-target-browser.json)" = '{"schema":1,"target":"browser"}'
          test ! -e internal/webui/embedded/build-target-native.json
          pnpm run typecheck:worker
          pnpm run typecheck:browser-tests
          pnpm exec wrangler types deploy/cloudflare/worker-configuration.d.ts --include-runtime false --check -c deploy/cloudflare/wrangler.jsonc
          pnpm exec eslint deploy/cloudflare/worker.ts e2e-browser --max-warnings=0
          python3 scripts/ci-browser-artifacts.py pack artifacts/ci-browser-package
      - name: Publish exact browser build without native UI substitution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build-identity.outputs.name }}
          path: artifacts/ci-browser-package/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  wasm-parity:
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.frontend-quality.outputs.build-attempt }}
    name: Compiled WASM Signal Verification
    runs-on: ubuntu-latest
    needs: frontend-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: wasm-parity
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend-quality.outputs.artifact-name }}
          path: artifacts/ci-download
      - name: Validate and restore exact compiled build
        run: python3 scripts/ci-artifacts.py restore artifacts/ci-download
      - name: Run all native/WASM and automation parity assertions
        env:
          AURIALIS_USE_CI_ASSETS: "1"
        run: bash scripts/test-wasm.sh
      - name: Verify actual local-job WASM against native CDR and mastering
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-local
          node scripts/verify-browser-jobs.mjs | tee artifacts/browser-local/wasm-oracle.log
      - name: Retain local-job native and WASM oracle evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-job-wasm-oracle-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-local/
          retention-days: 7

  go-wasm:
    name: Go 1.26 & WASM Quality Gate
    if: always()
    needs: [go-static-quality, go-race-meters, wasm-parity, parser-fuzz-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require static, race, meter and actual compiled parity
        env:
          STATIC_RESULT: ${{ needs.go-static-quality.result }}
          RACE_RESULT: ${{ needs.go-race-meters.result }}
          WASM_RESULT: ${{ needs.wasm-parity.result }}
          FUZZ_RESULT: ${{ needs.parser-fuzz-smoke.result }}
        run: test "$STATIC_RESULT" = success && test "$RACE_RESULT" = success && test "$WASM_RESULT" = success && test "$FUZZ_RESULT" = success

  backend-newman:
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.frontend-quality.outputs.build-attempt }}
    name: Backend API & Postman/Newman Gate
    runs-on: ubuntu-latest
    needs: frontend-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend-quality.outputs.artifact-name }}
          path: artifacts/ci-download
      - name: Validate and restore exact compiled build
        run: python3 scripts/ci-artifacts.py restore artifacts/ci-download
      - name: Run complete Postman/Newman and raw security probes
        env:
          AURIALIS_TEST_BINARY: ${{ github.workspace }}/aurialis
        run: pnpm run test:backend:postman

  playwright-shards:
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.frontend-quality.outputs.build-attempt }}
    name: Playwright Chromium Shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: frontend-quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: browser-oracles-${{ matrix.shard }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Identify pinned Playwright browser version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare bounded Ubuntu package downloads
        timeout-minutes: 1
        run: bash scripts/ci-ubuntu-apt.sh
      - name: Install required Chromium OS dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium
      - name: Restore Chromium browser cache
        id: chromium-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium on cache miss
        timeout-minutes: 4
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - name: Save Chromium from one designated shard
        if: matrix.shard == 1 && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.frontend-quality.outputs.artifact-name }}
          path: artifacts/ci-download
      - name: Validate and restore exact compiled build
        run: python3 scripts/ci-artifacts.py restore artifacts/ci-download
      - name: Run browser shard with one audio worker and no retries
        env:
          AURIALIS_E2E_BINARY: ${{ github.workspace }}/artifacts/ci-runtime/aurialis-e2e
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/ci-playwright/shard-${{ matrix.shard }}.json
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3 --workers=1 --retries=0 --global-timeout=720000 --reporter=list,json
      - name: Retain actual shard outcomes and PCM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            artifacts/ci-playwright/
            test-results/
          retention-days: 7

  static-browser:
    name: Static Browser Local-audio Verification
    env:
      NEXT_PUBLIC_AURIALIS_EXECUTION: browser
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.browser-build.outputs.build-attempt }}
      AURIALIS_USE_CI_BROWSER_ASSETS: "1"
      CLOUDFLARE_SEND_METRICS: "false"
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-go
        with:
          role: browser-static-oracles
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Identify pinned Playwright browser version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare bounded Ubuntu package downloads
        timeout-minutes: 1
        run: bash scripts/ci-ubuntu-apt.sh
      - name: Install required Chromium OS dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium
      - name: Restore Chromium without adding another cache writer
        id: chromium-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium on cache miss
        timeout-minutes: 4
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.browser-build.outputs.artifact-name }}
          path: artifacts/ci-browser-download
      - name: Restore exact browser assets and verify native-equivalent static headers
        run: |
          python3 scripts/ci-browser-artifacts.py restore artifacts/ci-browser-download
          AURIALIS_BROWSER_STATIC_DIR="$PWD/deploy/cloudflare" go test ./internal/browserjobs -run '^TestGeneratedStaticPolicyMatchesNative$' -count=1
      - name: Run real browser audio workflows with no audio network transfers
        run: AURIALIS_BROWSER_QA=1 pnpm exec playwright test --config playwright.browser.config.ts --workers=1 --retries=0 --global-timeout=540000
      - name: Retain static browser outcomes, exact WAV and request inventories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-browser-local-audio-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/browser-local/
          retention-days: 7

  playwright-engine-matrix:
    name: ${{ matrix.browser }} Playback (${{ matrix.target }})
    needs: [frontend-quality, browser-build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [native, browser]
        browser: [firefox, webkit]
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ matrix.target == 'native' && needs.frontend-quality.outputs.build-attempt || needs.browser-build.outputs.build-attempt }}
      NEXT_PUBLIC_AURIALIS_EXECUTION: ${{ matrix.target == 'browser' && 'browser' || 'native' }}
      AURIALIS_USE_CI_BROWSER_ASSETS: ${{ matrix.target == 'browser' && '1' || '0' }}
      PLAYWRIGHT_ENGINE_TARGET: ${{ matrix.target }}
      PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/browser-engines/results-${{ matrix.target }}-${{ matrix.browser }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Identify pinned Playwright browser version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Prepare bounded Ubuntu package downloads
        timeout-minutes: 1
        run: bash scripts/ci-ubuntu-apt.sh
      - name: Install required browser OS dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps "${{ matrix.browser }}"
      - name: Restore Playwright engine cache
        id: engine-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install browser on cache miss
        timeout-minutes: 6
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install "${{ matrix.browser }}"
      - name: Record Firefox clock before CI audio provisioning
        if: matrix.browser == 'firefox'
        run: node scripts/ci-firefox-audio.mjs before
      - name: Provision an isolated Linux audio output for Firefox
        if: matrix.browser == 'firefox'
        timeout-minutes: 3
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio pulseaudio-utils
          bash scripts/ci-firefox-audio.sh start
      - name: Require the real Firefox audio clock after provisioning
        if: matrix.browser == 'firefox'
        run: node scripts/ci-firefox-audio.mjs after
      - name: Save engine cache from the native target only
        if: matrix.target == 'native' && steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.target == 'native' && needs.frontend-quality.outputs.artifact-name || needs.browser-build.outputs.artifact-name }}
          path: artifacts/engine-download
      - name: Verify and restore native QA artifact
        if: matrix.target == 'native'
        run: python3 scripts/ci-artifacts.py restore artifacts/engine-download
      - name: Verify and restore receipt-verified browser artifact
        if: matrix.target == 'browser'
        run: python3 scripts/ci-browser-artifacts.py restore artifacts/engine-download
      - name: Run actual Firefox or WebKit playback against the restored target
        env:
          AURIALIS_E2E_BINARY: ${{ github.workspace }}/artifacts/ci-runtime/aurialis-e2e
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-engines
          port=3847
          if [ "$PLAYWRIGHT_ENGINE_TARGET" = browser ]; then port=3928; fi
          if [ "$PLAYWRIGHT_ENGINE_TARGET" = native ]; then
            bash scripts/serve-e2e.sh "$port" > artifacts/browser-engines/server.log 2>&1 &
          else
            NEXT_PUBLIC_AURIALIS_EXECUTION=browser AURIALIS_USE_CI_BROWSER_ASSETS=1 AURIALIS_BROWSER_QA=1 bash scripts/serve-browser-e2e.sh > artifacts/browser-engines/server.log 2>&1 &
          fi
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          ready=false
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$PLAYWRIGHT_ENGINE_TARGET" = native ]; then
              marker="$(curl -fsS --max-time 2 "http://127.0.0.1:$port/build-target-native.json" 2>/dev/null || true)"
              if [ "$marker" = '{"schema":1,"target":"native"}' ]; then ready=true; break; fi
            elif curl -fsS --max-time 2 "http://127.0.0.1:$port/" >/dev/null 2>&1; then
              ready=true; break
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then cat artifacts/browser-engines/server.log; exit 1; fi
          PLAYWRIGHT_ENGINE_BASE_URL="http://127.0.0.1:$port" \
            pnpm exec playwright test --config playwright.engines.config.ts \
              --project="${{ matrix.browser }}-audio" --workers=1 --retries=0 \
              --global-timeout=360000 2>&1 | tee artifacts/browser-engines/playwright.log
      - name: Stop the owned Firefox CI audio server
        if: always() && matrix.browser == 'firefox'
        run: bash scripts/ci-firefox-audio.sh stop
      - name: Retain cross-engine playback, traces, and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-engine-${{ matrix.target }}-${{ matrix.browser }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-engines/
          retention-days: 7

  playwright-e2e:
    name: Playwright Responsive (320px-1440px) & WCAG 2.2 AA Gate
    if: always()
    needs: [playwright-shards, static-browser, playwright-engine-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Chromium, Firefox, WebKit, and static-browser job
        env:
          SHARDS_RESULT: ${{ needs.playwright-shards.result }}
          STATIC_RESULT: ${{ needs.static-browser.result }}
          ENGINE_RESULT: ${{ needs.playwright-engine-matrix.result }}
        run: test "$SHARDS_RESULT" = success && test "$STATIC_RESULT" = success && test "$ENGINE_RESULT" = success

  ci-passed:
    name: CI Passed
    if: always()
    needs:
      - repo-and-agent-hygiene
      - go-wasm
      - frontend-quality
      - backend-newman
      - playwright-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          RES_HYGIENE: ${{ needs.repo-and-agent-hygiene.result }}
          RES_GO: ${{ needs.go-wasm.result }}
          RES_FRONTEND: ${{ needs.frontend-quality.result }}
          RES_NEWMAN: ${{ needs.backend-newman.result }}
          RES_PLAYWRIGHT: ${{ needs.playwright-e2e.result }}
        run: |
          for r in "$RES_HYGIENE" "$RES_GO" "$RES_FRONTEND" "$RES_NEWMAN" "$RES_PLAYWRIGHT"; do
            if [ "$r" != "success" ]; then
              echo "::error::One or more CI jobs failed or were cancelled ($r)."
              exit 1
            fi
          done
          echo "All CI gates passed."

  # Deploys the exact browser artifact every gate above verified. Not keyed on
  # the ref: two merges must never deploy at once or production can go backwards.
  cloudflare-deploy:
    name: Deploy to Cloudflare
    needs: [ci-passed, browser-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      url: https://aurialis.yosefgamble.com
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false
    outputs:
      version-id: ${{ steps.deploy.outputs.version-id }}
    env:
      NEXT_PUBLIC_AURIALIS_EXECUTION: browser
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.browser-build.outputs.build-attempt }}
      CLOUDFLARE_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install Wrangler
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.browser-build.outputs.artifact-name }}
          path: artifacts/ci-browser-download
      - name: Restore exact browser assets
        run: python3 scripts/ci-browser-artifacts.py restore artifacts/ci-browser-download
      - name: Deploy the Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler deploy -c deploy/cloudflare/wrangler.jsonc \
            --message "$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          # `wrangler rollback` takes this id; the deploy log is the only place it is printed.
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          version_id="$(sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/deploy.log" \
            | grep -iE 'current version id:' | tail -n 1 | grep -oE "$uuid")" || version_id=''
          echo "version-id=$version_id" >> "$GITHUB_OUTPUT"
          {
            echo '### Deployed to production'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker version id: \`${version_id:-not found in deploy output}\`"
            echo
            echo 'To roll back, run the **Cloudflare Rollback** workflow with the id of a previous deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test production
        timeout-minutes: 5
        env:
          SMOKE_FAILURE_HINT: Roll back with the Cloudflare Rollback workflow, using the version id of the previous deploy.
        run: .github/scripts/smoke-cloudflare.sh https://aurialis.yosefgamble.com https://aurialis.yosef.app
