name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  repo-and-agent-hygiene:
    name: War Room, Stack & Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce pnpm-only lockfile policy
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "::error::Forbidden lockfile detected (package-lock.json or yarn.lock). Use pnpm (pnpm-lock.yaml) only."
            exit 1
          fi

      - name: Enforce zero external icon libraries in src/
        run: |
          if [ -d src ]; then
            if grep -RInE "from ['\"](lucide-react|@heroicons/react|react-icons|feather-icons)" src/; then
              echo "::error::External icon libraries are forbidden in src/. Use custom inline SVGs (src/components/shared/Icon.tsx)."
              exit 1
            fi
          fi

      - name: Verify multi-model War Room agent synchronization
        run: |
          python3 -m py_compile scripts/sync-agents.py .claude/hooks/scrutinise.py
          python3 scripts/sync-agents.py --check

      - name: Smoke-test Stop hook (Claude Code & Gemini Argon payloads)
        run: |
          echo '{"stop_hook_active": true}' | python3 .claude/hooks/scrutinise.py
          OUT_CLAUDE=$(echo '{"stop_hook_active": false, "last_assistant_message": "Still working on slice."}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_CLAUDE" | grep -q '"decision": "block"'
          OUT_AGY=$(echo '{"hook_event_name": "Stop", "response": "Still working on slice."}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_AGY" | grep -q '"decision": "block"'

      - name: Validate GitHub Actions workflows with actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7 /tmp
          /tmp/actionlint -color

  go-wasm:
    name: Go 1.26 & WASM Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_go_mod: ${{ steps.check_go.outputs.has_go_mod }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for go.mod
        id: check_go
        run: |
          if [ -f go.mod ]; then
            echo "has_go_mod=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_go_mod=false" >> "$GITHUB_OUTPUT"
            echo "::notice::go.mod not yet scaffolded (tracked under WASM-1 in .claude/war-room/ledger.md)."
          fi

      - name: Set up Go
        if: steps.check_go.outputs.has_go_mod == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.0"
          check-latest: true

      - name: Check gofmt formatting
        if: steps.check_go.outputs.has_go_mod == 'true'
        run: |
          DIRS=()
          for d in cmd internal wasm; do
            if [ -d "$d" ]; then
              DIRS+=("$d")
            fi
          done
          if [ "${#DIRS[@]}" -gt 0 ]; then
            UNFORMATTED=$("$(go env GOROOT)/bin/gofmt" -l "${DIRS[@]}")
            if [ -n "$UNFORMATTED" ]; then
              echo "::error::The following Go files are not gofmt-formatted:"
              echo "$UNFORMATTED"
              exit 1
            fi
          fi

      - name: Verify Go modules and run go vet
        if: steps.check_go.outputs.has_go_mod == 'true'
        run: |
          go mod verify
          go vet ./...

      - name: Run golangci-lint v2 (staticcheck all, revive, gosec, nakedret)
        if: steps.check_go.outputs.has_go_mod == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2
          args: --timeout=5m

      - name: Run identypo & govulncheck
        if: steps.check_go.outputs.has_go_mod == 'true'
        run: |
          go run github.com/AlexsJones/identypo@latest ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run Go unit & concurrency race tests
        if: steps.check_go.outputs.has_go_mod == 'true'
        run: go test -race -count=1 -timeout 10m ./...

      - name: Compile WebAssembly DSP module (GOOS=js GOARCH=wasm)
        if: steps.check_go.outputs.has_go_mod == 'true'
        run: |
          if [ -d wasm/dsp ]; then
            mkdir -p public/wasm
            GOOS=js GOARCH=wasm go build -trimpath -o public/wasm/aurialis-dsp.wasm ./wasm/dsp
            ls -lh public/wasm/aurialis-dsp.wasm
          fi

  frontend-quality:
    name: Next.js 16, TypeScript & Bundle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_pkg: ${{ steps.check_pkg.outputs.has_pkg }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check_pkg
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "::notice::package.json not yet scaffolded (tracked under WASM-2 in .claude/war-room/ledger.md)."
          fi

      - name: Set up pnpm
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        if: steps.check_pkg.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (pnpm frozen-lockfile)
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm exec tsc --noEmit

      - name: Lint (ESLint v9 strictTypeChecked, --max-warnings=0)
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm run lint

      - name: Dead-code & spellcheck gates (knip & cspell)
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: |
          if jq -e '.scripts.knip or .devDependencies.knip' package.json >/dev/null 2>&1; then
            pnpm exec knip
          fi
          if jq -e '.scripts.cspell or .devDependencies.cspell' package.json >/dev/null 2>&1; then
            pnpm exec cspell lint "**/*.{ts,tsx,go,md}"
          fi

      - name: Run Vitest unit & component suite
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm test

      - name: Build Next.js 16 production bundle
        if: steps.check_pkg.outputs.has_pkg == 'true'
        run: pnpm run build

  backend-newman:
    name: Backend API & Postman/Newman Gate
    runs-on: ubuntu-latest
    needs: [go-wasm, frontend-quality]
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend & Postman suite are present
        id: check_newman
        run: |
          if [ -f go.mod ] && [ -d cmd/aurialis ] && [ -d tests/postman ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Backend cmd/aurialis or tests/postman not yet scaffolded."
          fi

      - name: Set up Go
        if: steps.check_newman.outputs.ready == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.0"
          check-latest: true

      - name: Set up pnpm
        if: steps.check_newman.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        if: steps.check_newman.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies & run Postman/Newman PR Suite
        if: steps.check_newman.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          MAX_UPLOAD_BYTES_OVERRIDE=209715200 pnpm run test:backend:postman

  playwright-e2e:
    name: Playwright Responsive (320px-1440px) & WCAG 2.2 AA Gate
    runs-on: ubuntu-latest
    needs: [go-wasm, frontend-quality]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Playwright suite is present
        id: check_pw
        run: |
          if [ -f package.json ] && [ -d e2e ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Playwright e2e/ suite not yet scaffolded."
          fi

      - name: Set up pnpm
        if: steps.check_pw.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        if: steps.check_pw.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies & Playwright Chromium
        if: steps.check_pw.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E, Responsive & Accessibility tests
        if: steps.check_pw.outputs.ready == 'true'
        run: pnpm exec playwright test

  ci-passed:
    name: CI Passed
    if: always()
    needs:
      - repo-and-agent-hygiene
      - go-wasm
      - frontend-quality
      - backend-newman
      - playwright-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          RES_HYGIENE: ${{ needs.repo-and-agent-hygiene.result }}
          RES_GO: ${{ needs.go-wasm.result }}
          RES_FRONTEND: ${{ needs.frontend-quality.result }}
          RES_NEWMAN: ${{ needs.backend-newman.result }}
          RES_PLAYWRIGHT: ${{ needs.playwright-e2e.result }}
        run: |
          for r in "$RES_HYGIENE" "$RES_GO" "$RES_FRONTEND" "$RES_NEWMAN" "$RES_PLAYWRIGHT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::One or more CI jobs failed or were cancelled ($r)."
              exit 1
            fi
          done
          echo "All CI gates passed."
