name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  AURIALIS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  repo-and-agent-hygiene:
    name: War Room, Stack & Workflow Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce pnpm-only lockfile policy
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "::error::Forbidden lockfile detected (package-lock.json or yarn.lock). Use pnpm (pnpm-lock.yaml) only."
            exit 1
          fi

      - name: Enforce zero external icon libraries in src/
        run: |
          if [ -d src ]; then
            if grep -RInE "from ['\"](lucide-react|@heroicons/react|react-icons|feather-icons)" src/; then
              echo "::error::External icon libraries are forbidden in src/. Use custom inline SVGs (src/components/shared/Icon.tsx)."
              exit 1
            fi
          fi

      - name: Verify multi-model War Room agent synchronization
        run: |
          python3 -m py_compile scripts/sync-agents.py .claude/hooks/scrutinise.py
          python3 scripts/sync-agents.py --check
          python3 scripts/test-ci-artifacts.py
          python3 scripts/test-e2e-build.py

      - name: Smoke-test Stop hook (Claude Code & Gemini Argon payloads)
        run: |
          rm -rf .claude/hooks/.state
          OUT_CLAUDE_1=$(echo '{"hook_event_name": "Stop", "session_id": "ci-1"}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_CLAUDE_1" | grep -q '"decision": "block"'
          OUT_CLAUDE_2=$(echo '{"hook_event_name": "Stop", "session_id": "ci-1"}' | python3 .claude/hooks/scrutinise.py)
          test -z "$OUT_CLAUDE_2"
          OUT_AGY_1=$(echo '{"terminationReason": "NO_TOOL_CALL", "conversationId": "ci-2"}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_AGY_1" | grep -q '"decision": "continue"'
          OUT_AGY_2=$(echo '{"terminationReason": "NO_TOOL_CALL", "conversationId": "ci-2"}' | python3 .claude/hooks/scrutinise.py)
          echo "$OUT_AGY_2" | grep -q '"decision": "allow"'
          rm -rf .claude/hooks/.state

      - name: Validate GitHub Actions workflows with actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7 /tmp
          /tmp/actionlint -color

  go-static-quality:
    name: Go Static & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          role: static-security
      - name: Check gofmt formatting
        run: |
          UNFORMATTED=$("$(go env GOROOT)/bin/gofmt" -l cmd internal wasm)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Go formatting differs: $UNFORMATTED"
            exit 1
          fi
      - name: Verify Go modules and run go vet
        run: |
          go mod verify
          go vet ./...
      - name: Run golangci-lint v2
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0
          args: --timeout=5m
      - name: Run identypo & govulncheck
        run: |
          go run github.com/alexkohler/identypo/cmd/identypo@latest ./...
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  go-race-meters:
    name: Go Race & Independent Meters
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          role: race-meters
      - name: Run Go unit & concurrency race tests
        run: go test -race -count=1 -timeout 10m ./...
      - name: Install FFmpeg for independent meter verification
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            APT_OPTIONS=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            sudo apt-get "${APT_OPTIONS[@]}" update
            sudo apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Compare meters with independent FFmpeg reference
        timeout-minutes: 3
        run: python3 wasm/dsp/verify_meters.py

  frontend-quality:
    outputs:
      artifact-name: ${{ steps.build-identity.outputs.name }}
      build-attempt: ${{ steps.build-identity.outputs.attempt }}
    name: Next.js 16, TypeScript & Bundle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm run lint
      - name: Dead-code & spellcheck gates
        run: |
          pnpm exec knip
          pnpm exec cspell lint "**/*.{ts,tsx,go,md}"
      - name: Run Vitest unit & component suite
        run: pnpm test
      - uses: ./.github/actions/setup-go
        with:
          role: native-build
          embedded-source-key: ${{ hashFiles('src/**', 'public/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
      - name: Restore Next build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-node26-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node26-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}-
      - name: Identify immutable producer artifact
        id: build-identity
        run: |
          echo "name=aurialis-native-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Build native-target UI, dual WASM and production executable once
        run: |
          pnpm run build:binary
          pnpm run test:binary
          bash scripts/build-e2e.sh artifacts/ci-runtime/aurialis-e2e
          python3 scripts/ci-artifacts.py pack artifacts/ci-package
      - name: Publish same-run native build for quality, API and browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-identity.outputs.name }}
          path: artifacts/ci-package/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  wasm-parity:
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.frontend-quality.outputs.build-attempt }}
    name: Compiled WASM Signal Verification
    runs-on: ubuntu-latest
    needs: frontend-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          role: wasm-parity
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.0"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.frontend-quality.outputs.artifact-name }}
          path: artifacts/ci-download
      - name: Validate and restore exact compiled build
        run: python3 scripts/ci-artifacts.py restore artifacts/ci-download
      - name: Run all native/WASM and automation parity assertions
        env:
          AURIALIS_USE_CI_ASSETS: "1"
        run: bash scripts/test-wasm.sh

  go-wasm:
    name: Go 1.26 & WASM Quality Gate
    if: always()
    needs: [go-static-quality, go-race-meters, wasm-parity]
    runs-on: ubuntu-latest
    steps:
      - name: Require static, race, meter and actual compiled parity
        env:
          STATIC_RESULT: ${{ needs.go-static-quality.result }}
          RACE_RESULT: ${{ needs.go-race-meters.result }}
          WASM_RESULT: ${{ needs.wasm-parity.result }}
        run: test "$STATIC_RESULT" = success && test "$RACE_RESULT" = success && test "$WASM_RESULT" = success

  backend-newman:
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.frontend-quality.outputs.build-attempt }}
    name: Backend API & Postman/Newman Gate
    runs-on: ubuntu-latest
    needs: frontend-quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.frontend-quality.outputs.artifact-name }}
          path: artifacts/ci-download
      - name: Validate and restore exact compiled build
        run: python3 scripts/ci-artifacts.py restore artifacts/ci-download
      - name: Run complete Postman/Newman and raw security probes
        env:
          AURIALIS_TEST_BINARY: ${{ github.workspace }}/aurialis
        run: pnpm run test:backend:postman

  playwright-shards:
    env:
      AURIALIS_CI_BUILD_ATTEMPT: ${{ needs.frontend-quality.outputs.build-attempt }}
    name: Playwright Chromium Shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: frontend-quality
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-go
        with:
          role: browser-oracles-${{ matrix.shard }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: "26.12.0"
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Identify pinned Playwright browser version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium browser cache
        id: chromium-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium and OS dependencies on cache miss
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Save Chromium from one designated shard
        if: matrix.shard == 1 && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}
      - name: Install uncached OS dependencies on browser cache hit
        if: steps.chromium-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.frontend-quality.outputs.artifact-name }}
          path: artifacts/ci-download
      - name: Validate and restore exact compiled build
        run: python3 scripts/ci-artifacts.py restore artifacts/ci-download
      - name: Run browser shard with one audio worker and no retries
        env:
          AURIALIS_E2E_BINARY: ${{ github.workspace }}/artifacts/ci-runtime/aurialis-e2e
          PLAYWRIGHT_JSON_OUTPUT_NAME: artifacts/ci-playwright/shard-${{ matrix.shard }}.json
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/3 --workers=1 --retries=0 --global-timeout=720000 --reporter=list,json
      - name: Retain actual shard outcomes and PCM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            artifacts/ci-playwright/
            test-results/
          retention-days: 7

  playwright-e2e:
    name: Playwright Responsive (320px-1440px) & WCAG 2.2 AA Gate
    if: always()
    needs: playwright-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser shard
        env:
          SHARDS_RESULT: ${{ needs.playwright-shards.result }}
        run: test "$SHARDS_RESULT" = success

  ci-passed:
    name: CI Passed
    if: always()
    needs:
      - repo-and-agent-hygiene
      - go-wasm
      - frontend-quality
      - backend-newman
      - playwright-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream job results
        env:
          RES_HYGIENE: ${{ needs.repo-and-agent-hygiene.result }}
          RES_GO: ${{ needs.go-wasm.result }}
          RES_FRONTEND: ${{ needs.frontend-quality.result }}
          RES_NEWMAN: ${{ needs.backend-newman.result }}
          RES_PLAYWRIGHT: ${{ needs.playwright-e2e.result }}
        run: |
          for r in "$RES_HYGIENE" "$RES_GO" "$RES_FRONTEND" "$RES_NEWMAN" "$RES_PLAYWRIGHT"; do
            if [ "$r" != "success" ]; then
              echo "::error::One or more CI jobs failed or were cancelled ($r)."
              exit 1
            fi
          done
          echo "All CI gates passed."
